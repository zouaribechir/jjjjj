<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0D10"/>
      <stop offset="100%" stop-color="#12161B"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C5CFC"/>
      <stop offset="100%" stop-color="#9A82FD"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Subtle decorative grid -->
  <g opacity="0.05" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
  </g>

  <!-- Logo Mark -->
  <g transform="translate(100, 110)">
    <rect width="84" height="84" rx="20" fill="#7C5CFC"/>
    <rect x="18" y="16" width="48" height="16" rx="4" fill="#FFFFFF"/>
    <circle cx="26" cy="46" r="4.5" fill="#FFFFFF"/>
    <circle cx="42" cy="46" r="4.5" fill="#FFFFFF"/>
    <circle cx="58" cy="46" r="4.5" fill="#FFFFFF"/>
    <circle cx="26" cy="62" r="4.5" fill="#FFFFFF"/>
    <circle cx="42" cy="62" r="4.5" fill="#FFFFFF"/>
    <circle cx="58" cy="62" r="4.5" fill="#FFFFFF"/>
  </g>

  <!-- Brand Name -->
  <text x="210" y="165" fill="#F5F7FA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="1">CREATORCALC</text>

  <!-- Tagline -->
  <text x="100" y="290" fill="#F5F7FA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800">Calculate Your Creator Income,</text>
  <text x="100" y="354" fill="url(#brand)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800">Growth &amp; Performance</text>

  <!-- Subtitle -->
  <text x="100" y="430" fill="#A7B0BC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400">12 Free, Instant Calculators for YouTube, TikTok, Instagram, Affiliate &amp; Creator Businesses</text>

  <!-- Pills -->
  <g transform="translate(100, 485)">
    <rect x="0" y="0" width="160" height="42" rx="21" fill="#181D23" stroke="#252B33"/>
    <text x="80" y="27" fill="#F5F7FA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" text-anchor="middle">YouTube RPM</text>

    <rect x="180" y="0" width="160" height="42" rx="21" fill="#181D23" stroke="#252B33"/>
    <text x="260" y="27" fill="#F5F7FA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" text-anchor="middle">TikTok Money</text>

    <rect x="360" y="0" width="170" height="42" rx="21" fill="#181D23" stroke="#252B33"/>
    <text x="445" y="27" fill="#F5F7FA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" text-anchor="middle">Sponsorships</text>

    <rect x="550" y="0" width="180" height="42" rx="21" fill="#181D23" stroke="#252B33"/>
    <text x="640" y="27" fill="#F5F7FA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" text-anchor="middle">Engagement Rate</text>

    <rect x="750" y="0" width="160" height="42" rx="21" fill="#181D23" stroke="#252B33"/>
    <text x="830" y="27" fill="#3CCB8E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" text-anchor="middle">100% Free</text>
  </g>
</svg>
